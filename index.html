<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2030 직장인 드립대학 수다학과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<!-- Kakao 지도 JavaScript API (services 라이브러리 포함, autoload=false) -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=65cb25515f828d2dddc4f6be98970b3f&libraries=services&autoload=false"></script>
<style>
  :root {
    --paper:#F6F8FC; --dot:#E9EDF5; --ink:#202B45; --muted:#68758E;
    --card:#FFFFFF; --coral:#E85B52; --row-line:#E6EAF2;
    --mint-bg:#D8F7E8; --mint-ink:#0B5F43;
    --butter-bg:#FFF0B3; --butter-ink:#7A4B00;
    --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin:0; background-color:var(--paper);
    background-image: radial-gradient(#E8EDF5 .8px, transparent 1px); background-size:20px 20px;
    color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5;
    padding-block:12px 56px;
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  }
  .page { max-width:960px; margin:0 auto; width:100%; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:3px solid #5B8CFF; outline-offset:2px; }

  /* 헤더 & 카드 스타일 */
  .rainbow-title { width:min(100%,720px); display:block; margin:0 auto -4px; overflow:visible; }
  .rainbow-title text { font-family:var(--font-display); font-weight:900; paint-order:stroke fill; stroke:var(--ink); stroke-width:7px; stroke-linejoin:round; }
  .auth-card { width:min(100%,520px); margin:10px auto 22px; padding:24px; background:#fff; border:1px solid #E2E7F0; border-radius:16px; box-shadow:0 4px 16px rgba(32,43,69,.06); }
  .auth-card h2 { margin:0 0 5px; font-family:var(--font-display); font-size:28px; }
  .auth-help { margin:0 0 16px; color:var(--muted); font-size:13px; line-height:1.5; }
  .auth-card label { display:block; margin:12px 0 5px; font-weight:800; font-size:13px; }
  .remember-row { display:flex !important; align-items:center; gap:9px; margin:12px 0 2px !important; font-size:14px; cursor:pointer; }
  .auth-card input.remember-checkbox { width:19px; min-height:19px; height:19px; margin:0; accent-color:#167a55; }
  .auth-card input, .community-form input, .community-form textarea, .community-form select { width:100%; min-height:44px; border:1px solid #D8DFEA; border-radius:10px; padding:10px 12px; background:#fff; }
  .auth-actions { display:grid; gap:10px; margin-top:16px; }
  .auth-primary,.auth-secondary { min-height:46px; border-radius:10px; font-family:var(--font-body); font-size:15px; font-weight:800; border:1px solid #DCE2ED; }
  .auth-primary { background:#E85B52; color:#fff; border-color:#E85B52; } 
  .auth-secondary { background:#FFF1EF; color:#9F3732; border-color:#F2D0CC; }
  .auth-topline { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:4px auto 12px; max-width:960px; }
  .auth-user { font-weight:800; }
  .logout-btn { border:1px solid #DCE2ED; background:#fff; border-radius:10px; padding:6px 12px; font-weight:800; }

  /* 메인 네비게이션 버튼 */
  .nav-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:18px 0 30px; }
  .nav-btn { display:flex; align-items:center; justify-content:flex-start; gap:8px; border:1px solid rgba(32,43,69,.1); border-radius:15px; padding:14px 16px; font-family:var(--font-body); font-size:15px; font-weight:800; box-shadow:0 3px 10px rgba(32,43,69,.07); background:var(--card); color:var(--ink); transition:transform .15s, box-shadow .15s; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:58px; }
  .nav-btn:hover { transform:translateY(-1px); box-shadow:0 6px 14px rgba(32,43,69,.1); }
  .nav-btn.coral { background:#FFF1EF; color:#A9322D; }
  .nav-btn.mint { background:#EAF9F1; color:#176747; }
  .nav-btn.butter { background:#FFF7DF; color:#78520B; }

  /* 공통 버튼 & 레이아웃 */
  .btn { display:inline-flex; align-items:center; gap:8px; border:1px solid #DCE2ED; border-radius:10px; padding:9px 13px; font-weight:800; font-size:14px; background:var(--card); color:var(--ink); transition:background-color .15s, transform .15s; }
  .btn:hover { transform:translateY(-1px); }
  .btn.coral { background:#E85B52; color:#fff; border-color:#E85B52; }
  .btn.small { padding:7px 11px; font-size:13px; border-radius:9px; }
  
  .head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  h2.title { margin:0; font-family:var(--font-display); font-weight:400; font-size:clamp(23px,4vw,29px); line-height:1.2; letter-spacing:-.025em; }
  .sub { margin:4px 0 0; color:var(--muted); font-size:13px; line-height:1.45; }
  .community-panel { max-width:960px; margin:0 auto 28px; width:100%; }
  .community-form { display:grid; gap:10px; background:#fff; border:1px solid #E2E7F0; border-radius:16px; padding:18px; box-shadow:0 4px 16px rgba(32,43,69,.06); }
  .community-form h3 { margin:0 0 4px; font-size:18px; font-family:var(--font-display); }

  /* ===== 맛집/카페 공유 수정 레이아웃 ===== */
  .places-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 16px; }
  .places-tabs button { border:1px solid #DCE2ED; border-radius:18px; padding:7px 14px; background:#fff; font-weight:800; font-size:13.5px; transition:all .15s; }
  .places-tabs button.active { background:#202B45; color:#fff; border-color:#202B45; }
  
  /* 반응형 레이아웃: 넓은 화면에서 왼쪽(저장목록) / 오른쪽(지도 & 공유 폼) */
  .places-layout { display:grid; grid-template-columns:320px 1fr; gap:20px; align-items:start; }
  .places-left { min-width:0; }
  .places-right { min-width:0; display:grid; gap:16px; }
  .places-list-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 12px; }
  .places-list-head h3 { margin:0; font-size:17px; font-family:var(--font-display); }
  .places-list { display:grid; gap:12px; max-height:800px; overflow-y:auto; padding-right:4px; }
  
  /* 카카오맵 크게 확장 */
  .places-map { width:100%; height:520px; border:1px solid #DCE2ED; border-radius:16px; overflow:hidden; position:relative; background:#eef2f8; box-shadow:0 4px 16px rgba(32,43,69,.06); }
  
  .saved-place { padding:14px; border:1px solid #E2E7F0; border-radius:14px; background:#fff; box-shadow:0 2px 8px rgba(32,43,69,.04); transition:border-color .15s; cursor:pointer; }
  .saved-place:hover { border-color:#7396E8; }
  .saved-place strong { display:block; font-size:15.5px; line-height:1.4; margin-bottom:5px; color:#202B45; }
  .saved-place .place-address { font-size:12.5px; line-height:1.45; color:#555; margin-bottom:6px; }
  .saved-place .place-author { font-size:12px; color:#888; margin-bottom:8px; }
  .saved-place .place-memo { border-top:1px dashed #E2E7F0; padding-top:8px; margin:6px 0 8px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:13px; line-height:1.5; color:#333; }
  .saved-place .place-actions { display:flex; align-items:center; gap:8px; font-size:12px; }
  .saved-place .place-actions a { color:#3a86ff; text-decoration:none; font-weight:700; }
  
  .place-save-form label { display:grid; gap:5px; font-weight:800; font-size:13px; }
  .kakao-overlay-iw { padding:10px 14px; border-radius:12px; background:#fff; border:1px solid #202B45; font-size:13px; font-weight:700; box-shadow:0 4px 12px rgba(0,0,0,.15); white-space:nowrap; }

  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); background:var(--ink); color:#fff; border-radius:12px; padding:10px 16px; font-weight:700; font-size:14px; max-width:calc(100% - 32px); z-index:99; box-shadow:0 4px 12px rgba(0,0,0,.15); }

  @media(max-width:860px){
    .places-layout { grid-template-columns:1fr; }
    .places-left { order:2; }
    .places-right { order:1; }
    .places-map { height:400px; }
    .places-list { max-height:none; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- 메인 화면 -->
  <main id="mainView">
    <svg class="rainbow-title" viewBox="0 0 1000 245" role="img" aria-label="2030 직장인 드립대학 수다학과 무지개 제목">
      <defs>
        <linearGradient id="titleRainbow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff4d6d"/><stop offset="34%" stop-color="#ffe66d"/><stop offset="67%" stop-color="#3a86ff"/><stop offset="100%" stop-color="#ff4d6d"/></linearGradient>
        <path id="titleArc" d="M 65 218 Q 500 -80 935 218" fill="none"/>
      </defs>
      <text font-size="62" fill="url(#titleRainbow)" text-anchor="middle"><textPath href="#titleArc" startOffset="50%">2030 직장인 드립대학 수다학과</textPath></text>
    </svg>

    <div id="authTopline" class="auth-topline" hidden><span id="signedInLabel" class="auth-user"></span><button id="logoutBtn" class="logout-btn" type="button">로그아웃</button></div>

    <section id="loginCard" class="auth-card">
      <h2>로그인</h2><p class="auth-help">카카오톡 오픈채팅 닉네임과 인증번호를 입력해 주세요.</p>
      <form id="loginForm">
        <label for="loginNickname">닉네임</label><input id="loginNickname" maxlength="24" placeholder="등록한 닉네임" required>
        <label for="loginCode">인증번호</label><input id="loginCode" type="password" placeholder="인증번호 입력" required>
        <div class="auth-actions"><button class="auth-primary" type="submit">로그인</button></div>
      </form>
    </section>

    <!-- 버튼 수정: 맛집/카페 등 공유 -->
    <nav id="mainNav" class="nav-grid">
      <button class="nav-btn coral" id="goPlaces" type="button">☕ 맛집/카페 등 공유</button>
    </nav>
  </main>

  <!-- 맛집 · 카페 · 명소 · 숙소 · 기타 (Kakao 지도 공유) -->
  <section id="placesView" class="community-panel">
    <div class="head">
      <div>
        <h2 class="title">📍 맛집 · 카페 · 명소 공유</h2>
        <p class="sub">지도를 크게 확인하고 나만의 추천 장소를 회원들과 실시간으로 공유해 보세요!</p>
      </div>
      <button class="btn small" id="placesBack" type="button">← 메인으로</button>
    </div>

    <!-- 카테고리 탭 -->
    <div class="places-tabs" id="placesTabs">
      <button class="active" data-category="전체" type="button">🗺️ 전체</button>
      <button data-category="맛집" type="button">🍜 맛집</button>
      <button data-category="카페" type="button">☕ 카페</button>
      <button data-category="명소" type="button">📸 명소</button>
      <button data-category="숙소" type="button">🛏️ 숙소</button>
      <button data-category="기타" type="button">📌 기타</button>
    </div>

    <!-- 신규 배치: 왼쪽 저장 장소 리스트 / 오른쪽 지도 및 장소 공유 폼 -->
    <div class="places-layout">
      <!-- 왼쪽: 회원들이 저장한 장소 리스트 -->
      <div class="places-left">
        <div class="places-list-head">
          <h3>회원들이 저장한 장소</h3>
          <span class="sub">최신순</span>
        </div>
        <div id="savedPlaces" class="places-list">
          <!-- 스크립트로 렌더링 -->
        </div>
      </div>

      <!-- 오른쪽: 대형 지도 및 위치 검색 / 저장 폼 -->
      <div class="places-right">
        <div>
          <div id="placesMap" class="places-map" aria-label="Kakao 지도"></div>
          <p id="placesStatus" style="font-size:13px; color:#666; margin:8px 0 0; min-height:1.2em;"></p>
        </div>

        <form id="placeSaveForm" class="community-form place-save-form">
          <h3>장소 공유하기</h3>
          <label>분류
            <select id="placeCategory">
              <option>맛집</option>
              <option>카페</option>
              <option>명소</option>
              <option>숙소</option>
              <option>기타</option>
            </select>
          </label>
          <label>장소명
            <input id="placeName" maxlength="120" placeholder="예: 카페 몬타나" required>
          </label>
          <label>장소 위치 찾기 (카카오맵 검색)
            <div style="display:flex; gap:6px;">
              <input id="placeAddress" maxlength="300" placeholder="예: 덕산로312번길 124 또는 카페 이름" required>
              <button type="button" id="btnSearchKakao" class="btn coral small" style="white-space:nowrap; shrink:0;">📍 위치 검색</button>
            </div>
          </label>
          <input type="hidden" id="placeLat">
          <input type="hidden" id="placeLng">
          <label>추천 메모
            <textarea id="placeMemo" maxlength="1000" placeholder="추천 메뉴, 일산/파주 맛집 팁, 분위기 등" style="min-height:70px;"></textarea>
          </label>
          <button type="submit" class="btn coral" style="justify-content:center; padding:11px;">장소 저장 및 회원 공유</button>
        </form>
      </div>
    </div>
  </section>

</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    setTimeout(function () { t.hidden = true; }, 3000);
  }

  // 초기 샘플 저장 장소
  var savedPlacesData = [
    { id: 1, name: "카페 몬타나", category: "카페", address: "경기도 고양시 일산서구 덕산로312번길 124", lat: 37.6934, lng: 126.7451, author: "일산드립왕", memo: "넓은 정원과 뷰가 좋은 카페입니다!" },
    { id: 2, name: "피콕그린", category: "카페", address: "경기도 고양시 일산동구 성석로 111-45", lat: 37.6978, lng: 126.7923, author: "칼퇴요정", memo: "조용하고 분위기 넘치는 힐링 스팟이에요." }
  ];

  var map = null;
  var markers = [];
  var currentInfoWindow = null;
  var selectedCategory = "전체";

  // Kakao 지도 초기화
  function initKakaoMap() {
    if (typeof kakao === "undefined" || !kakao.maps) {
      $("placesStatus").textContent = "카카오맵 API를 불러오는 중이거나 키 설정이 필요합니다.";
      renderPlacesList();
      return;
    }

    kakao.maps.load(function () {
      var container = $("placesMap");
      var options = {
        center: new kakao.maps.LatLng(37.6934, 126.7451), // 일산/고양시 중심
        level: 5
      };
      map = new kakao.maps.Map(container, options);

      // 지도 클릭 시 좌표 및 주소 추출
      kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
        var latlng = mouseEvent.latLng;
        $("placeLat").value = latlng.getLat();
        $("placeLng").value = latlng.getLng();
        
        // 역지오코딩
        var geocoder = new kakao.maps.services.Geocoder();
        geocoder.coord2Address(latlng.getLng(), latlng.getLat(), function(result, status) {
          if (status === kakao.maps.services.Status.OK) {
            var addr = result[0].address ? result[0].address.address_name : '';
            $("placeAddress").value = addr;
            toast("지도에서 선택한 위치의 주소가 입력되었습니다.");
          }
        });
      });

      renderMarkersAndList();
    });
  }

  // 카카오맵 장소/주소 검색 구현
  function searchKakaoPlace() {
    var query = $("placeAddress").value.trim() || $("placeName").value.trim();
    if (!query) {
      toast("검색할 장소명이나 주소를 입력해 주세요.");
      return;
    }

    if (!map || typeof kakao === "undefined") {
      toast("지도 서비스를 불러올 수 없습니다.");
      return;
    }

    $("placesStatus").textContent = "'" + query + "' 위치를 검색 중입니다...";

    var ps = new kakao.maps.services.Places();
    ps.keywordSearch(query, function (data, status) {
      if (status === kakao.maps.services.Status.OK) {
        var first = data[0];
        var moveLatLon = new kakao.maps.LatLng(first.y, first.x);
        
        map.setCenter(moveLatLon);
        map.setLevel(3);

        $("placeLat").value = first.y;
        $("placeLng").value = first.x;
        $("placeAddress").value = first.road_address_name || first.address_name;
        if (!$("placeName").value.trim()) {
          $("placeName").value = first.place_name;
        }

        if (currentInfoWindow) currentInfoWindow.close();
        currentInfoWindow = new kakao.maps.InfoWindow({
          content: '<div class="kakao-overlay-iw">📍 ' + first.place_name + '</div>'
        });
        currentInfoWindow.open(map, new kakao.maps.Marker({ map: map, position: moveLatLon }));

        $("placesStatus").textContent = "위치를 찾았습니다: " + first.place_name;
        toast("장소 위치가 지도에 지정되었습니다.");
      } else {
        // 주소 검색 재시도
        var geocoder = new kakao.maps.services.Geocoder();
        geocoder.addressSearch(query, function (result, geoStatus) {
          if (geoStatus === kakao.maps.services.Status.OK) {
            var moveLatLon = new kakao.maps.LatLng(result[0].y, result[0].x);
            map.setCenter(moveLatLon);
            map.setLevel(3);
            $("placeLat").value = result[0].y;
            $("placeLng").value = result[0].x;
            $("placesStatus").textContent = "주소 위치를 찾았습니다.";
            toast("주소 위치가 지도에 지정되었습니다.");
          } else {
            $("placesStatus").textContent = "장소를 찾지 못했습니다. 정확한 명칭이나 주소를 입력해 주세요.";
            toast("검색 결과가 없습니다.");
          }
        });
      }
    });
  }

  // 마커 및 좌측 장소 목록 렌더링
  function renderMarkersAndList() {
    // 기존 마커 제거
    markers.forEach(function (m) { m.setMap(null); });
    markers = [];

    var filtered = savedPlacesData.filter(function (p) {
      return selectedCategory === "전체" || p.category === selectedCategory;
    });

    renderPlacesList(filtered);

    if (!map) return;

    filtered.forEach(function (place) {
      if (!place.lat || !place.lng) return;
      var pos = new kakao.maps.LatLng(place.lat, place.lng);
      var marker = new kakao.maps.Marker({
        map: map,
        position: pos,
        title: place.name
      });

      kakao.maps.event.addListener(marker, 'click', function () {
        if (currentInfoWindow) currentInfoWindow.close();
        currentInfoWindow = new kakao.maps.InfoWindow({
          content: '<div class="kakao-overlay-iw"><b>[' + place.category + ']</b> ' + place.name + '</div>'
        });
        currentInfoWindow.open(map, marker);
      });

      markers.push(marker);
    });
  }

  // 왼쪽 영역 장소 목록 출력
  function renderPlacesList(list) {
    var container = $("savedPlaces");
    container.innerHTML = "";

    var targetList = list || savedPlacesData;

    if (targetList.length === 0) {
      container.innerHTML = '<p style="font-size:13px; color:#888; padding:12px;">등록된 장소가 없습니다.</p>';
      return;
    }

    targetList.forEach(function (item) {
      var div = document.createElement("div");
      div.className = "saved-place";
      div.innerHTML = 
        '<strong>[' + item.category + '] ' + item.name + '</strong>' +
        '<div class="place-address">📍 ' + item.address + '</div>' +
        '<div class="place-author">작성자: ' + (item.author || '익명') + '</div>' +
        (item.memo ? '<div class="place-memo">' + item.memo + '</div>' : '') +
        '<div class="place-actions">' +
          '<a href="https://map.kakao.com/link/search/' + encodeURIComponent(item.name) + '" target="_blank">카카오맵 바로가기 ↗</a>' +
        '</div>';

      div.onclick = function () {
        if (map && item.lat && item.lng) {
          var moveLatLon = new kakao.maps.LatLng(item.lat, item.lng);
          map.setCenter(moveLatLon);
          map.setLevel(3);
          toast(item.name + " 위치로 이동했습니다.");
        }
      };

      container.appendChild(div);
    });
  }

  // 이벤트 바인딩
  window.onload = function () {
    $("goPlaces").onclick = function () {
      initKakaoMap();
    };

    $("btnSearchKakao").onclick = searchKakaoPlace;

    // 카테고리 탭 변경
    var tabs = document.querySelectorAll("#placesTabs button");
    tabs.forEach(function (btn) {
      btn.onclick = function () {
        tabs.forEach(function (b) { b.classList.remove("active"); });
        btn.classList.add("active");
        selectedCategory = btn.getAttribute("data-category");
        renderMarkersAndList();
      };
    });

    // 장소 저장 폼
    $("placeSaveForm").onsubmit = function (e) {
      e.preventDefault();
      var name = $("placeName").value.trim();
      var category = $("placeCategory").value;
      var address = $("placeAddress").value.trim();
      var memo = $("placeMemo").value.trim();
      var lat = parseFloat($("placeLat").value) || 37.6934;
      var lng = parseFloat($("placeLng").value) || 126.7451;

      var newPlace = {
        id: Date.now(),
        name: name,
        category: category,
        address: address,
        memo: memo,
        lat: lat,
        lng: lng,
        author: "드립회원"
      };

      savedPlacesData.unshift(newPlace);
      renderMarkersAndList();
      
      $("placeName").value = "";
      $("placeAddress").value = "";
      $("placeMemo").value = "";
      $("placeLat").value = "";
      $("placeLng").value = "";

      toast("장소가 정상적으로 공유 및 저장되었습니다!");
    };

    // 초기 실행
    initKakaoMap();
  };
})();
</script>
</body>
</html>
